name: Test RFQ routes

run-name: "RFQ routes: ${{ inputs.network || 'testnet' }} · ${{ inputs.routes || 'its,native-wrap,gateway,solana' }} from ${{ inputs.source || 'avalanche' }}"

# End-to-end check of the rfq-api routes that gate ITS quotes on mainnet
# (`axe test rfq`). Each route is quoted and its actions are sent on the
# source chain in turn, then every transfer's status is polled until DONE.
# Scheduled runs cover testnet; mainnet runs only through a manual dispatch.
#
# Funding the shared EVM wallet needs on the source chain: native gas for the
# ITS fees (paid as transaction value) and the native-wrap amount, plus the
# gateway USDC (aUSDC on testnet). The its and solana routes wrap native gas
# themselves when the wallet's wrapped balance is short.
on:
  # Every 6 hours, clear of the intents (00:30, 12:30) and route (00:00,
  # 12:00) schedules.
  schedule:
    - cron: '45 2,8,14,20 * * *'
  workflow_dispatch:
    inputs:
      network:
        description: Axelar network
        type: choice
        required: true
        default: testnet
        options:
          - testnet
          - mainnet
      routes:
        description: Comma-separated routes to run, in order (its, native-wrap, gateway, solana)
        type: string
        required: true
        default: its,native-wrap,gateway,solana
      source:
        description: Source chain (Fuji or Sepolia on testnet)
        type: choice
        required: true
        default: avalanche
        options:
          - avalanche
          - ethereum

permissions:
  contents: read

# Testnet runs share EVM_PRIVATE_KEY with the intents workflow, so they queue
# in its group rather than contend for the account nonce.
concurrency:
  group: ${{ (inputs.network || 'testnet') == 'mainnet' && 'intents-mainnet' || 'intents-testnet' }}
  cancel-in-progress: false

jobs:
  test-rfq:
    runs-on: ubuntu-latest
    # The sends take minutes, then every transfer is polled for up to 45
    # minutes at once.
    timeout-minutes: 75
    env:
      NETWORK: ${{ inputs.network || 'testnet' }}
      ROUTES: ${{ inputs.routes || 'its,native-wrap,gateway,solana' }}
      SOURCE: ${{ inputs.source || 'avalanche' }}
    steps:
      - uses: actions/checkout@v4

      # Prefer the binary built for this exact commit, but fall back to a local
      # release build when no artifact exists.
      - name: Download pre-built axe (${{ github.sha }})
        id: download_axe
        continue-on-error: true
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: build-axe.yml
          name: axe-${{ github.sha }}
          commit: ${{ github.sha }}
          path: target/release
          if_no_artifact_found: warn

      - name: Mark pre-built axe executable
        if: steps.download_axe.outputs.found_artifact == 'true'
        shell: bash
        run: chmod +x target/release/axe

      - name: Set up Rust toolchain (fallback)
        if: steps.download_axe.outputs.found_artifact != 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo cache (fallback)
        if: steps.download_axe.outputs.found_artifact != 'true'
        uses: Swatinem/rust-cache@v2

      - name: Build axe (fallback)
        if: steps.download_axe.outputs.found_artifact != 'true'
        shell: bash
        run: cargo build --release --locked

      - name: Clone chains config (sibling)
        shell: bash
        run: |
          set -euo pipefail
          DEPLOYMENTS="$GITHUB_WORKSPACE/../axelar-contract-deployments"
          git clone --depth 1 --filter=blob:none --sparse \
            https://github.com/axelarnetwork/axelar-contract-deployments.git "$DEPLOYMENTS"
          git -C "$DEPLOYMENTS" sparse-checkout set axelar-chains-config/info

      # Testnet takes private RPCs through FUJI_RPC_URL and SEP_RPC_URL.
      # Mainnet has no such override, so its endpoints go into a runner-temp
      # copy of the config, keeping RPC credentials out of both working trees.
      - name: Prepare mainnet chains config
        id: config
        if: env.NETWORK == 'mainnet'
        shell: bash
        env:
          AVALANCHE_MAINNET_RPC: ${{ secrets.AVALANCHE_MAINNET_RPC }}
          ETHEREUM_MAINNET_RPC: ${{ secrets.ETHEREUM_MAINNET_RPC }}
        run: |
          set -euo pipefail
          SOURCE_CONFIG="$GITHUB_WORKSPACE/../axelar-contract-deployments/axelar-chains-config/info/mainnet.json"
          TARGET="$RUNNER_TEMP/rfq-mainnet.json"
          jq \
            --arg avalanche "${AVALANCHE_MAINNET_RPC:-}" \
            --arg ethereum "${ETHEREUM_MAINNET_RPC:-}" \
            '(.chains[] | select(.chainId == 43114).rpc) |= if $avalanche == "" then . else $avalanche end
             | (.chains[] | select(.chainId == 1).rpc) |= if $ethereum == "" then . else $ethereum end' \
            "$SOURCE_CONFIG" > "$TARGET"
          chmod 600 "$TARGET"
          echo "path=$TARGET" >> "$GITHUB_OUTPUT"

      - name: Run routes
        shell: bash
        env:
          CHAINS_CONFIG: ${{ steps.config.outputs.path }}
          FUJI_RPC_URL: ${{ secrets.AVALANCHE_TESTNET_RPC }}
          SEP_RPC_URL: ${{ secrets.ETHEREUM_TESTNET_RPC }}
          EVM_PRIVATE_KEY: ${{ secrets.EVM_PRIVATE_KEY }}
          SOLANA_PRIVATE_KEY: ${{ secrets.SOLANA_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${EVM_PRIVATE_KEY:-}" ]; then
            echo "::error::The EVM_PRIVATE_KEY repository secret is required" >&2
            exit 1
          fi
          if [ -z "${CHAINS_CONFIG:-}" ]; then
            unset CHAINS_CONFIG
          fi
          # The solana route's default recipient is the configured Solana key's
          # address. axe reads SOLANA_PRIVATE_KEY as a keypair file path, and
          # the secret holds the JSON array, so write it to a runner-temp file.
          if [ -z "${SOLANA_PRIVATE_KEY:-}" ]; then
            unset SOLANA_PRIVATE_KEY
          elif [[ "$SOLANA_PRIVATE_KEY" == \[* ]]; then
            KEY_FILE="$RUNNER_TEMP/solana_keypair.json"
            printf '%s' "$SOLANA_PRIVATE_KEY" > "$KEY_FILE"
            chmod 600 "$KEY_FILE"
            export SOLANA_PRIVATE_KEY="$KEY_FILE"
          fi
          # stdout carries the JSON summary, and progress streams on stderr.
          ./target/release/axe --network "$NETWORK" test rfq \
            --route "$ROUTES" --source "$SOURCE" --json > "$RUNNER_TEMP/rfq-summary.json"

      - name: Write RFQ route summary
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          SUMMARY="$RUNNER_TEMP/rfq-summary.json"
          {
            echo "## RFQ routes: $NETWORK from $SOURCE"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          if ! jq -e '.routes | length > 0' "$SUMMARY" > /dev/null 2>&1; then
            echo "_No route summary was written; check the Run routes step log._" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          {
            echo "| Status | Route | Backend | Quote | Final state | Elapsed | Error |"
            echo "|---|---|---|---|---|---|---|"
            jq -r '.routes[] | [
                (if .error == null then "✓" else "✗" end),
                .route,
                (.backend // "-"),
                (.quoteId // "-"),
                (.status.state // "-"),
                ((.elapsedSecs | tostring) + " s"),
                ((.error // "") | gsub("[|\r\n]"; " ") | .[0:200])
              ] | "| " + join(" | ") + " |"' "$SUMMARY"
            echo ""
            jq -r '"**\([.routes[] | select(.error == null)] | length) / \(.routes | length) passed**"' "$SUMMARY"
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY"
          jq -e 'all(.routes[]; .error == null)' "$SUMMARY" > /dev/null
