name: Test Express Execution

# Verifies Axelar express-execution reimbursement in two phases:
#   Phase 1 — express executed (the relayer fronted funds to the recipient)
#   Phase 2 — executor reimbursed (the canonical execute landed, firing
#             ExpressExecutionFulfilled atomically)
#
# Two modes:
#
#   monitor   (default) — observe only. Reads the public GMP API, so it needs
#             no wallet keys, RPC overrides, or chains-config.
#
#   originate — end-to-end test of the REAL express executor. axe sends the
#             registry's express asset (testnet aUSDC, mainnet axlUSDC)
#             through the AxelarApp proxy registered under the `axelar-app`
#             project in gmp-api/config/projects.yml, which is the only shape
#             the gmp-express-executor service picks up: the gateway path
#             (ContractCallWithToken — express never sees ITS), an allowlisted
#             access-controlled destination, an amount inside the registry cap,
#             and gas paid via payNativeGasForExpressCallWithToken. axe does
#             NOT express-execute anything itself; it originates and then
#             watches, so a green run means the service fronted the funds and
#             was reimbursed in full. Needs EVM_PRIVATE_KEY.

on:
  workflow_call:
    inputs:
      mode:
        type: string
        required: false
        default: originate
      network:
        type: string
        required: false
        default: testnet
      source_chain:
        type: string
        required: false
        default: avalanche
      destination_chain:
        type: string
        required: false
        default: ethereum-sepolia
      amount:
        type: string
        required: false
        default: '10'
      gas_value:
        type: string
        required: false
        default: '350000000000000000'
jobs:
  express-monitor:
    runs-on: ubuntu-latest
    # Must stay above the monitor's own `--timeout-secs` (1200 = 20 min) so a
    # stall ends as axe's own red failure naming the phase it stalled at. With
    # both clocks at 20 minutes the runner won the race and SIGKILLed axe,
    # which GitHub reports as "cancelled", not "failure" (run 34350578640).
    # Same margin, same reason, as test-routes.yml.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Express support is per-network: a chain that is express-enabled on
      # mainnet may not be on testnet, and the sepolia ids only exist on
      # testnet. The dropdown offers the union, so the pair is checked here
      # rather than failing later with an opaque API or revert error.
      - name: Check the chains are express-supported on this network
        shell: bash
        env:
          NETWORK: ${{ inputs.network || 'testnet' }}
          MODE: ${{ inputs.mode || 'originate' }}
          SRC: ${{ inputs.source_chain || 'avalanche' }}
          DST: ${{ inputs.destination_chain || 'ethereum-sepolia' }}
        run: |
          set -euo pipefail
          # Measured, not assumed: a chain can originate only if the
          # AxelarApp proxy is deployed on it (eth_getCode) AND the express
          # registry has gas config for it (gmp-api/config/projects.yml).
          # Testnet carries the proxy on exactly two chains.
          if [ "$NETWORK" = mainnet ]; then
            SUPPORTED="arbitrum avalanche base binance blast celo ethereum filecoin fraxtal immutable kava linea mantle moonbeam optimism polygon scroll"
          else
            SUPPORTED="avalanche ethereum-sepolia"
          fi
          supported() { case " $SUPPORTED " in *" $1 "*) return 0 ;; *) return 1 ;; esac; }

          if [ "$MODE" = originate ]; then
            if [ "$DST" = all ]; then
              echo "::error::originate needs one destination chain, not 'all'" >&2
              exit 1
            fi
            for chain in "$SRC" "$DST"; do
              if ! supported "$chain"; then
                echo "::error::$chain is not express-supported on $NETWORK (supported: $SUPPORTED)" >&2
                exit 1
              fi
            done
          elif [ "$DST" != all ] && ! supported "$DST"; then
            echo "::error::$DST is not express-supported on $NETWORK (supported: $SUPPORTED)" >&2
            exit 1
          fi

      # Build-or-download strategy mirrors test-routes.yml so a code
      # change automatically invalidates a stale prebuilt artifact.
      - name: Download pre-built axe (${{ github.sha }})
        id: download_axe
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: build-axe.yml
          name: axe-${{ github.sha }}
          commit: ${{ github.sha }}
          path: target/release
          if_no_artifact_found: warn

      - name: Mark pre-built axe executable
        if: steps.download_axe.outputs.found_artifact == 'true'
        shell: bash
        run: chmod +x target/release/axe

      - name: Set up Rust toolchain (fallback)
        if: steps.download_axe.outputs.found_artifact != 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo cache (fallback)
        if: steps.download_axe.outputs.found_artifact != 'true'
        uses: Swatinem/rust-cache@v2

      - name: Build axe (fallback)
        if: steps.download_axe.outputs.found_artifact != 'true'
        shell: bash
        run: cargo build --release --locked

      # Real-executor end-to-end test: originate a qualifying transfer, then
      # watch it through both phases. Fails red if the service never fronts it
      # or the fronted/reimbursed amounts differ.
      - name: Originate + verify real express execution
        if: ${{ (inputs.mode || 'originate') == 'originate' }}
        shell: bash
        env:
          NETWORK: ${{ inputs.network || 'testnet' }}
          SOURCE_CHAIN: ${{ inputs.source_chain || 'avalanche' }}
          DEST_CHAIN: ${{ inputs.destination_chain || 'ethereum-sepolia' }}
          AMOUNT: ${{ inputs.amount || '10' }}
          GAS_VALUE: ${{ inputs.gas_value || '350000000000000000' }}
          EVM_PRIVATE_KEY: ${{ secrets.EVM_PRIVATE_KEY }}
          AVALANCHE_TESTNET_RPC: ${{ secrets.AVALANCHE_TESTNET_RPC }}
          AVALANCHE_MAINNET_RPC: ${{ secrets.AVALANCHE_MAINNET_RPC }}
        run: |
          set -euo pipefail
          if [ -z "${EVM_PRIVATE_KEY:-}" ]; then
            echo "::error::originate mode needs the EVM_PRIVATE_KEY secret" >&2
            exit 1
          fi
          # Prefer the private source RPC when the secret is set.
          if [ "$SOURCE_CHAIN" = avalanche ]; then
            if [ "$NETWORK" = mainnet ] && [ -n "${AVALANCHE_MAINNET_RPC:-}" ]; then
              export SOURCE_RPC="$AVALANCHE_MAINNET_RPC"
            elif [ "$NETWORK" != mainnet ] && [ -n "${AVALANCHE_TESTNET_RPC:-}" ]; then
              export SOURCE_RPC="$AVALANCHE_TESTNET_RPC"
            fi
          fi
          ./target/release/axe --network "$NETWORK" test express-execution \
            --originate \
            --source-chain "$SOURCE_CHAIN" \
            --destination-chain "$DEST_CHAIN" \
            --amount "$AMOUNT" \
            --gas-value "$GAS_VALUE" \
            --timeout-secs 1200

      - name: Monitor express execution
        if: ${{ (inputs.mode || 'originate') == 'monitor' }}
        shell: bash
        env:
          DEST_CHAIN: ${{ inputs.destination_chain || 'ethereum-sepolia' }}
          NETWORK: ${{ inputs.network || 'testnet' }}
        run: |
          set -euo pipefail
          # "all" expands to the network's express-supported chains; any other
          # choice scans just that destination chain. (The GMP-API destinationChain filter is
          # case-insensitive, so lowercase axelar ids are fine.) The per-network
          # lists come from live express activity on the Axelarscan GMP API.
          if [ "$DEST_CHAIN" = all ]; then
            if [ "$NETWORK" = mainnet ]; then
              CHAIN_ARGS=(ethereum base binance optimism polygon arbitrum mantle celo avalanche linea scroll blast)
            else
              CHAIN_ARGS=(avalanche ethereum-sepolia)
            fi
          else
            CHAIN_ARGS=("$DEST_CHAIN")
          fi
          ./target/release/axe test express-execution "${CHAIN_ARGS[@]}" --network "$NETWORK"
